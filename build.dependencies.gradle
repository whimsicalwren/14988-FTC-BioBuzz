repositories {
    mavenCentral()
    google()
    maven {
        url = "https://mymaven.bylazar.com/releases"
    }
    maven {
        url = "https://repo.dairy.foundation/releases"
    }
}


dependencies {
    implementation "org.firstinspires.ftc:Inspection:${ftc_version}"
    implementation "org.firstinspires.ftc:Blocks:${ftc_version}"
    //noinspection Aligned16KB
    implementation "org.firstinspires.ftc:RobotCore:${ftc_version}"
    implementation "org.firstinspires.ftc:RobotServer:${ftc_version}"
    implementation "org.firstinspires.ftc:OnBotJava:${ftc_version}"
    implementation "org.firstinspires.ftc:Hardware:${ftc_version}"
    implementation "org.firstinspires.ftc:FtcCommon:${ftc_version}"
    implementation "org.firstinspires.ftc:Vision:${ftc_version}"
    //noinspection GradleDependency
    implementation "androidx.appcompat:appcompat:1.2.0"

    implementation "com.pedropathing:revhub:${revhub_version}"
    implementation "com.pedropathing:tuning:${tuning_version}"
    implementation "com.pedropathing.ivy:pedro:${ivy_version}"

    implementation "com.bylazar:fullpanels:${panels_version}"

    implementation "dev.nextftc:bindings:${bindings_version}"
    implementation "dev.nextftc.v2:control:${nftc_version}"
    implementation "dev.nextftc.v2:hardware:${nftc_version}"
    implementation "dev.nextftc.v2:units:${nftc_version}"

    //noinspection NewerVersionAvailable
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    //noinspection NewerVersionAvailable
    implementation "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    //noinspection NewerVersionAvailable
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}"
}

